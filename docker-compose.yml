services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build: ./server
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://safety:${POSTGRES_PASSWORD:-change-me}@db:5432/safety
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3-vl:4b}
      AI_CONCURRENCY: ${AI_CONCURRENCY:-1}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-600}
    depends_on:
      db:
        condition: service_healthy
      model-loader:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: safety
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: safety
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safety -d safety"]
      interval: 5s
      timeout: 5s
      retries: 20

  ollama:
    image: ollama/ollama:0.12.3
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  model-loader:
    image: ollama/ollama:0.12.3
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["until ollama list >/dev/null 2>&1; do sleep 2; done; ollama pull ${OLLAMA_MODEL:-qwen3-vl:4b}"]
    depends_on:
      ollama:
        condition: service_healthy

volumes:
  postgres_data:
  ollama_data:
